<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partilhar - Ultimos registros</title>
  <style>
    :root{--bg:#f7f4ef;--surface:#fff;--ink:#1f2a2e;--muted:#657277;--line:#d9ded8;--brand:#1f6f5b;--brand-dark:#124938;--focus:#f0b86d;--shadow:0 14px 40px rgba(31,42,46,.1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:22px clamp(18px,5vw,72px);background:rgba(255,255,255,.76);border-bottom:1px solid var(--line)}main{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:32px 0 54px}h1,h2,h3,p{margin-top:0}p{color:var(--muted);line-height:1.55}a{color:var(--brand-dark);font-weight:700}.section{border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);padding:clamp(18px,4vw,28px);margin-bottom:20px}.form-grid{display:grid;grid-template-columns:minmax(180px,300px) repeat(2,minmax(150px,220px)) auto;gap:12px;align-items:end}label{display:grid;gap:7px;font-weight:780}input{min-height:46px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}button{min-height:46px;border:0;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer;font-weight:850;padding:10px 16px}input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.status{min-height:24px;color:var(--brand-dark);font-weight:750;margin:12px 0 0}.tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}th{color:var(--brand-dark);font-size:.78rem;text-transform:uppercase}@media(max-width:900px){header{align-items:flex-start;flex-direction:column}.form-grid,.tables{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div><h1>Ultimos registros</h1><p>Consulta separada para ver o que entrou recentemente na planilha.</p></div><a href="./responsaveis.html">Voltar para responsaveis</a></header>
<main><section class="section"><h2>Filtro</h2><div class="form-grid"><label>Codigo da equipe <input id="team-code" type="password" autocomplete="current-password"></label><label>De <input id="date-from" type="date"></label><label>Ate <input id="date-to" type="date"></label><button id="load-records" type="button">Carregar registros</button></div><p class="status" id="status">Informe o codigo e escolha o periodo.</p></section><section class="section" id="records-section" hidden><h2>Registros recentes</h2><div class="tables"><div><h3>Doacoes e entradas</h3><table id="recent-donations"></table></div><div><h3>Voluntarios</h3><table id="recent-volunteers"></table></div><div><h3>Estoque</h3><table id="recent-movements"></table></div><div><h3>Contatos</h3><table id="recent-contacts"></table></div></div></section></main>
<script>
const CONFIG={appsScriptUrl:"https://script.google.com/macros/s/AKfycby9SKUJbkoiH9BIjG5J_lsvuMCfnzZYkqTWW3ZK551vIHvU6ZJ4g1-CT-j1syMRdxbS/exec"},statusEl=document.querySelector("#status");document.querySelector("#load-records").addEventListener("click",loadRecords);["#team-code","#date-from","#date-to"].forEach(id=>document.querySelector(id).addEventListener(id==="#team-code"?"input":"change",saveAccess));restoreAccess();
function loadRecords(){const code=document.querySelector("#team-code").value.trim();if(!code){statusEl.textContent="Informe o codigo da equipe.";return}saveAccess();statusEl.textContent="Carregando...";callScript({route:"summary",codigoEquipe:code,dateFrom:document.querySelector("#date-from").value,dateTo:document.querySelector("#date-to").value},data=>{if(!data.ok){statusEl.textContent=data.error||"Nao foi possivel carregar.";return}document.querySelector("#records-section").hidden=false;renderObjectTable("#recent-donations",data.recent.donations||[],["Criado em","Nome","Item","Quantidade","Status"]);renderObjectTable("#recent-volunteers",data.recent.volunteers||[],["Criado em","Nome","Sabado","Area","Status"]);renderObjectTable("#recent-movements",data.recent.movements||[],["Data","Tipo","Produto","Quantidade","Tarefa/origem/destino"]);renderObjectTable("#recent-contacts",data.recent.contacts||[],["Criado em","Nome","Assunto","Status"]);statusEl.textContent="Registros carregados."},()=>statusEl.textContent="Falha ao conectar.")}
function callScript(obj,ok,err){const cb="partilharRegistros_"+Date.now()+"_"+Math.floor(Math.random()*10000),script=document.createElement("script"),params=new URLSearchParams({...obj,callback:cb});window[cb]=data=>{delete window[cb];script.remove();ok(data)};script.onerror=()=>{delete window[cb];script.remove();if(err)err()};script.src=CONFIG.appsScriptUrl+"?"+params.toString();document.body.appendChild(script)}
function renderObjectTable(sel,rows,cols){document.querySelector(sel).innerHTML=`<thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]||"")}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}">Sem dados.</td></tr>`}</tbody>`}
function saveAccess(){localStorage.setItem("partilharTeamCode",document.querySelector("#team-code").value.trim());localStorage.setItem("partilharDateFrom",document.querySelector("#date-from").value);localStorage.setItem("partilharDateTo",document.querySelector("#date-to").value)}function restoreAccess(){document.querySelector("#team-code").value=localStorage.getItem("partilharTeamCode")||"";document.querySelector("#date-from").value=localStorage.getItem("partilharDateFrom")||"";document.querySelector("#date-to").value=localStorage.getItem("partilharDateTo")||""}function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
</script>
</body>
</html>
